# Fluid 主题配置（只写覆盖项，其余沿用主题默认）
# 文档：https://hexo.fluid-dev.com/docs/

favicon: /img/favicon.png
apple_touch_icon: /img/apple-touch-icon.png
force_https: true

code:
  copy_btn: true
  language:
    enable: true
  highlight:
    enable: true
    line_number: true
    lib: highlightjs
    highlightjs:
      style: "github"
      style_dark: "github-dark"

dark_mode:
  enable: true
  default: auto

color:
  body_bg_color: "#f3f1ec"
  body_bg_color_dark: "#0e1a1f"
  navbar_bg_color: "#12303a"
  navbar_bg_color_dark: "#0b1d24"
  navbar_text_color: "#eef3f2"
  navbar_text_color_dark: "#d0d8d8"
  subtitle_color: "#eef3f2"
  subtitle_color_dark: "#d0d8d8"
  text_color: "#2f3e44"
  text_color_dark: "#c6cfd0"
  sec_text_color: "#6b7b80"
  sec_text_color_dark: "#9aa8ab"
  board_color: "#fffdf9"
  board_color_dark: "#16252b"
  post_text_color: "#25343a"
  post_text_color_dark: "#c6cfd0"
  post_heading_color: "#12303a"
  post_heading_color_dark: "#dfe7e7"
  post_link_color: "#1f7a80"
  post_link_color_dark: "#6cc6c8"
  link_hover_color: "#c27c2c"
  link_hover_color_dark: "#e8aa5a"
  link_hover_bg_color: "#f5efe4"
  link_hover_bg_color_dark: "#22363d"
  line_color: "#e6e1d6"
  line_color_dark: "#2c4148"
  button_hover_bg_color: "#efe9dd"
  button_hover_bg_color_dark: "#2a4a52"

font:
  font_size: 16px
  font_family: '"Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif'
  letter_spacing: 0.02em
  code_font_size: 85%

custom_css: /css/custom.css

navbar:
  blog_title: "Springbudder"
  ground_glass:
    enable: true
    px: 6
    alpha: 0.75
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

search:
  enable: true
  content: true

banner:
  parallax: true
  width_height_ratio: 1.0

footer:
  content: '
    <span>© 2017–2026 黄成琛 Springbudder</span>
    <span class="footer-sep">·</span>
    <a href="https://hexo.io" target="_blank" rel="nofollow noopener"><span>Hexo</span></a>
    <i class="iconfont icon-love"></i>
    <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="nofollow noopener"><span>Fluid</span></a>
  '

index:
  banner_img: /img/banner.jpg
  banner_img_height: 78
  banner_mask_alpha: 0.15
  slogan:
    enable: true
    text:
      - "AI × 医药 · 从分子诊断到大模型落地"
  auto_excerpt:
    enable: true

post:
  banner_img: /img/banner-page.jpg
  banner_img_height: 45
  banner_mask_alpha: 0.2
  meta:
    author:
      enable: false
    date:
      enable: true
      format: "YYYY年M月D日"
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 300
    views:
      enable: false
  updated:
    enable: false
  toc:
    enable: true
    placement: right
    headingSelector: "h1,h2,h3,h4,h5,h6"
    collapseDepth: 0
  copyright:
    enable: true
    content: "CC BY-NC-SA 4.0"
    author: true
    post_date: true
    update_date: false
  prev_next:
    enable: true
  image_zoom:
    enable: true
  math:
    enable: true
    specific: true
    engine: mathjax
  mermaid:
    enable: true
    specific: true

archive:
  banner_img: /img/banner-page.jpg
  banner_img_height: 45
  banner_mask_alpha: 0.2

category:
  enable: true
  banner_img: /img/banner-page.jpg
  banner_img_height: 45
  banner_mask_alpha: 0.2

tag:
  enable: true
  banner_img: /img/banner-page.jpg
  banner_img_height: 45
  banner_mask_alpha: 0.2

about:
  enable: true
  banner_img: /img/banner-page.jpg
  banner_img_height: 45
  banner_mask_alpha: 0.2
  avatar: /img/avatar.png
  name: "黄成琛 · Springbudder"
  intro: "医药 AI 与数字化 · 分子诊断 · 医学事务 · 临床证据"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/Springbudder", tip: "GitHub" }
    - { class: "iconfont icon-rss", link: "/atom.xml", tip: "RSS" }

page:
  banner_img: /img/banner-page.jpg
  banner_img_height: 45
  banner_mask_alpha: 0.2

page404:
  enable: true
  banner_img: /img/banner-page.jpg
  banner_img_height: 60
  banner_mask_alpha: 0.2

links:
  enable: false
